name: daily-policy

on:
  # 定时触发已停用（2026-10-15 起每日任务由腾讯云服务器 cron 主跑，避免双跑覆盖）；
  # 需要时可在 Actions 页面手动 Run workflow 应急
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-policy
  cancel-in-progress: false

jobs:
  run:
    name: 每日检索与研判
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --quiet requests

      - name: Crawl and analyze
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python scripts/policy_daily.py

      - name: Validate data file
        run: |
          node -e "global.window={};require('./policy-data.js');const n=window.POLICY_SEED.length;if(!(n>=120))throw new Error('entry count abnormal: '+n);console.log('policy-data.js OK,',n,'entries');"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add policy-data.js runlog.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "每日更新 ${RUN_TS} 新增${NEW_COUNT}条"
            git push
          fi
